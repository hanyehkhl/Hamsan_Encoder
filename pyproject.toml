[project]
name = "hamsan"
version = "0.1.0"
description = "Hamsan (همسان): Persian sentence-embedding model, evaluated on the Cuttlas corpus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "sentence-transformers>=3.0",
    "datasets",
    "accelerate",
    "hazm",
    "mteb>=2.21.8",
]

[tool.uv]
package = false

# torch با CUDA 12.6 برای GPU (RTX 4050)
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
